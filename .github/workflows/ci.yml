# CI runs the repository gate — the same ./scripts/verify.sh a developer
# runs locally — on Linux and Windows, plus a weekly long randomized
# pass over the parse-boundary properties.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  verify:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # shell: bash so Windows runs the same gate script (Git Bash on hosted runners).
      - name: Repository gate
        shell: bash
        run: ./scripts/verify.sh

  long-properties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Long randomized property run
        env:
          AUTOJOURNAL_PROPERTY_ITERS: "2000000"
        run: node --experimental-strip-types --test "test/engine/properties.test.ts" "test/engine/properties-alias-cursor.test.ts"

